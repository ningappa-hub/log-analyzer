services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:////app/data/logs.db
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    env_file:
      - ./backend/.env
    volumes:
      - backend-data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  backend-data: